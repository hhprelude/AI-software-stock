name: AI RS daily prices and dashboard

on:
  # 09:37 KST Tue–Sat, after the prior US trading day has closed.
  schedule:
    - cron: '37 0 * * 2-6'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'update_prices.py'
      - 'requirements.txt'
      - '.github/workflows/daily.yml'

permissions:
  contents: write   # preserve daily data in the repository
  pages: write
  id-token: write

concurrency:
  group: ai-rs-pages
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get dashboard source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install price-feed library
        run: python -m pip install -r requirements.txt
      - name: Download prices and validate completeness
        run: python update_prices.py
      - name: Preserve latest successfully verified data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ai_rs_latest.csv
          if ! git diff --cached --quiet; then
            git commit -m 'data: update AI relative strength prices'
            git push origin HEAD:main
          else
            echo 'No changed daily prices to commit.'
          fi
      - name: Build public site
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/ai_rs_latest.csv _site/data/ai_rs_latest.csv
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
